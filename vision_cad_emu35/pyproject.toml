[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-cad-emu35"
version = "0.1.0"
description = "MVP for fine-tuning and deploying Emu3.5 for vision-based CAD modeling step reverse generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.28",
  "peft>=0.10",
  "tensorboard>=2.14",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
eval = ["scikit-image>=0.22", "lpips>=0.1.4", "open-clip-torch>=2.24"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

