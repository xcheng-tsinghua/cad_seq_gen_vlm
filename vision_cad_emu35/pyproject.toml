[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-cad-emu35"
version = "0.1.0"
description = "RAG-based frozen Emu3.5 system for vision-based CAD modeling step reverse generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "modelscope>=1.17",
  "huggingface_hub>=0.23",
  "pydantic>=2.0",
  "transformers==4.48.3",
]

[project.optional-dependencies]
clip = ["open-clip-torch>=2.24"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
