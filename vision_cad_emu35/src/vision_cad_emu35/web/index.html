<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vision CAD Emu3.5 RAG Demo</title>
  <style>
    :root {
      --bg: #f5f6f3;
      --panel: #ffffff;
      --ink: #171717;
      --muted: #656b70;
      --line: #d8ddd8;
      --accent: #0b7f82;
      --warn: #9a5b00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    main { max-width: 1360px; margin: 0 auto; padding: 22px 24px; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
    form, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; }
    input[type=file], input[type=number], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
      color: var(--ink);
      background: white;
    }
    textarea { min-height: 96px; resize: vertical; }
    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 12px;
      color: white;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .images { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    figure {
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    figcaption {
      padding: 9px 11px;
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid var(--line);
    }
    img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #111;
    }
    .result { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; }
    .metric { min-width: 170px; }
    .metric b { display: block; color: var(--muted); font-size: 12px; font-weight: 550; }
    .metric span { display: block; font-size: 18px; font-weight: 750; overflow-wrap: anywhere; }
    .notice {
      margin: 14px 0;
      padding: 10px 12px;
      border-radius: 6px;
      background: #fff7e6;
      color: var(--warn);
      border: 1px solid #ead39a;
      display: none;
    }
    .examples { margin-top: 16px; display: grid; gap: 10px; }
    .example {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
    }
    .example strong { display: block; margin-bottom: 4px; }
    .status { color: var(--muted); font-size: 14px; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .images { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vision CAD Emu3.5 RAG Demo</h1>
    <span id="status" class="status">checking...</span>
  </header>
  <main>
    <div class="layout">
      <form id="form">
        <label>Final snapshot
          <input id="final" name="final_snapshot" type="file" accept="image/*" required />
        </label>
        <label>Previous depth map
          <input id="prev" name="prev_depth_map" type="file" accept="image/*" required />
        </label>
        <label>Top K
          <input id="topK" name="top_k" type="number" min="0" max="10" value="3" />
        </label>
        <label>Extra prompt
          <textarea id="promptExtra" name="prompt_extra"></textarea>
        </label>
        <button id="submit" type="submit">Generate</button>
      </form>
      <section>
        <div class="images">
          <figure>
            <figcaption>Query final snapshot</figcaption>
            <img id="finalPreview" alt="" />
          </figure>
          <figure>
            <figcaption>Query previous depth map</figcaption>
            <img id="prevPreview" alt="" />
          </figure>
          <figure>
            <figcaption>Generated overlay</figcaption>
            <img id="outPreview" alt="" />
          </figure>
        </div>
        <div id="notice" class="notice"></div>
        <div class="panel result">
          <div class="metric"><b>Operation type</b><span id="op">-</span></div>
          <div class="metric"><b>Latency</b><span id="latency">-</span></div>
          <div class="metric"><b>Mode</b><span id="mode">-</span></div>
          <div class="metric"><b>KB items</b><span id="kbCount">-</span></div>
          <div class="metric"><b>KB directory</b><span id="kbDir">-</span></div>
          <div class="metric"><b>Model</b><span id="modelState">-</span></div>
        </div>
        <div class="examples" id="examples"></div>
      </section>
    </div>
  </main>
  <script>
    const form = document.getElementById('form');
    const finalInput = document.getElementById('final');
    const prevInput = document.getElementById('prev');
    const submit = document.getElementById('submit');
    const notice = document.getElementById('notice');
    const examples = document.getElementById('examples');
    const setPreview = (input, image) => {
      if (input.files && input.files[0]) image.src = URL.createObjectURL(input.files[0]);
    };
    finalInput.addEventListener('change', () => setPreview(finalInput, document.getElementById('finalPreview')));
    prevInput.addEventListener('change', () => setPreview(prevInput, document.getElementById('prevPreview')));

    function showNotice(text) {
      notice.textContent = text || '';
      notice.style.display = text ? 'block' : 'none';
    }

    function renderExamples(items) {
      examples.innerHTML = '';
      if (!items || items.length === 0) {
        const div = document.createElement('div');
        div.className = 'example';
        div.textContent = 'No retrieved examples available; running zero-shot mode.';
        examples.appendChild(div);
        return;
      }
      items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'example';
        const score = typeof item.score === 'number' ? item.score.toFixed(3) : 'n/a';
        div.innerHTML = `<strong>Reference ${idx + 1}: ${item.operation_type || 'unknown'}</strong>` +
          `<div>Similarity score: ${score}</div>` +
          `<div>Sample: ${item.sample_id || ''}</div>`;
        examples.appendChild(div);
      });
    }

    fetch('/health').then(r => r.json()).then(j => {
      document.getElementById('status').textContent = j.kb_empty
        ? 'KB empty, zero-shot ready'
        : `KB ready: ${j.kb_item_count} items`;
      document.getElementById('kbCount').textContent = String(j.kb_item_count);
      document.getElementById('kbDir').textContent = j.kb_dir || '-';
      document.getElementById('mode').textContent = j.kb_empty ? 'zero-shot' : 'RAG';
      document.getElementById('modelState').textContent = j.model_loaded ? 'loaded' : 'not loaded';
      if (j.kb_empty) showNotice('Knowledge base is empty. The system is running in zero-shot mode.');
    }).catch(() => {
      document.getElementById('status').textContent = 'server unavailable';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      showNotice('');
      const data = new FormData(form);
      try {
        const response = await fetch('/generate', { method: 'POST', body: data });
        const json = await response.json();
        if (!response.ok) throw new Error(json.detail || 'request failed');
        document.getElementById('op').textContent = json.operation_type || '-';
        document.getElementById('latency').textContent = `${json.latency_seconds.toFixed(2)} s`;
        document.getElementById('mode').textContent = json.zero_shot ? 'zero-shot' : 'RAG';
        if (json.kb_dir) document.getElementById('kbDir').textContent = json.kb_dir;
        if (json.image_base64) {
          document.getElementById('outPreview').src = `data:image/png;base64,${json.image_base64}`;
        }
        renderExamples(json.retrieved_examples || []);
        if (json.zero_shot) showNotice('Knowledge base is empty. The system is running in zero-shot mode.');
      } catch (err) {
        showNotice(err.message);
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
