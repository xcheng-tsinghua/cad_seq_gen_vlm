model:
  model_root: "/root/autodl-tmp/data"
  model_id_or_path: "/root/autodl-tmp/data/BAAI/Emu3.5"
  tokenizer_path: "/root/autodl-tmp/data/BAAI/Emu3.5"
  vision_tokenizer_path: "/root/autodl-tmp/data/BAAI/Emu3.5-VisionTokenizer"
  emu_repo_path: null
  local_files_only: true
  trust_remote_code: true
  image_size: 512
  precision: "bf16"
  use_lora: true
  use_qlora: false
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.05
  gradient_checkpointing: true
  vq_type: "ibq"

data:
  dataset_root: "/path/to/your/dataset"
  output_dir: "outputs/emu35_finetune"
  manifest_dir: "data/manifests"
  add_stop_samples: true
  stop_image_policy: "copy_last_depth"
  train_ratio: 0.9
  val_ratio: 0.05
  test_ratio: 0.05
  split_by_part_id: true
  image_size: 512
  num_workers: 8

training:
  seed: 42
  epochs: 10
  batch_size_per_device: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 10
  validation_steps: 500
  save_steps: 500
  save_total_limit: 5
  resume_from_checkpoint: null
  mixed_precision: "bf16"
  compile_model: false
  max_text_length: 2048

generation:
  max_new_tokens: 1024
  max_image_tokens: null
  temperature: 0.2
  top_p: 0.9
  do_sample: false

logging:
  tensorboard: true
  wandb: false
  project_name: "vision_cad_emu35"

